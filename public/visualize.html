<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FindYourDate — Route Flow Visualizer</title>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#080c18; color:#e2e8f0;
      font-family:'Segoe UI', system-ui, -apple-system, sans-serif; display:flex; }

    /* ── Sidebar ── */
    #sidebar {
      width:290px; min-width:290px; height:100vh;
      background:rgba(8,12,26,0.98);
      border-right:1px solid rgba(99,179,237,0.13);
      display:flex; flex-direction:column; overflow:hidden; z-index:20;
    }
    #sb-header {
      padding:13px 16px;
      background:linear-gradient(135deg,rgba(99,179,237,0.08),rgba(159,122,234,0.06));
      border-bottom:1px solid rgba(99,179,237,0.12);
      text-align:center; flex-shrink:0;
    }
    #sb-title { font-size:.92rem; font-weight:800; color:#63b3ed; letter-spacing:.4px; }
    #sb-sub   { font-size:.66rem; color:#4a5568; margin-top:3px; }

    #sb-scroll { flex:1; overflow-y:auto; padding:6px 9px 10px; }
    #sb-scroll::-webkit-scrollbar{width:3px}
    #sb-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:2px}

    .grp-label {
      font-size:.61rem; font-weight:700; color:#2d3748;
      text-transform:uppercase; letter-spacing:1.5px; padding:10px 3px 5px;
    }
    .rbtn {
      width:100%; margin-bottom:4px; padding:9px 10px;
      background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.06);
      border-radius:7px; cursor:pointer; text-align:left;
      transition:background .14s,border-color .14s;
    }
    .rbtn:hover { background:rgba(255,255,255,0.06); border-color:rgba(255,255,255,0.16); }
    .rbtn.active { background:rgba(99,179,237,0.1); border-color:rgba(99,179,237,0.4); }
    .rbtn-top { display:flex; align-items:center; gap:6px; margin-bottom:2px; }
    .badge {
      font-size:.59rem; font-weight:700; padding:1px 5px; border-radius:3px; flex-shrink:0;
    }
    .GET    { background:rgba(104,211,145,.18); color:#68d391; }
    .POST   { background:rgba(246,173,85,.18);  color:#f6ad55; }
    .SOCKET { background:rgba(118,228,247,.18); color:#76e4f7; }
    .rbtn-path { font-size:.78rem; font-weight:700; color:#e2e8f0; }
    .rbtn-desc { font-size:.68rem; color:#4a5568; }

    /* ── Speed controls ── */
    #speed-bar {
      flex-shrink:0; padding:7px 10px;
      border-top:1px solid rgba(255,255,255,0.05);
      display:flex; align-items:center; gap:6px;
    }
    #speed-lbl { font-size:.65rem; color:#4a5568; }
    .spd {
      flex:1; padding:3px 0;
      border:1px solid rgba(255,255,255,0.08); background:transparent;
      color:#4a5568; border-radius:4px; cursor:pointer; font-size:.67rem;
      transition:all .14s;
    }
    .spd:hover { background:rgba(255,255,255,0.06); color:#e2e8f0; }
    .spd.on { background:rgba(99,179,237,0.14); border-color:rgba(99,179,237,0.4); color:#63b3ed; }

    /* ── Legend ── */
    #legend {
      flex-shrink:0; padding:7px 10px 9px;
      border-top:1px solid rgba(255,255,255,0.05);
      display:flex; flex-wrap:wrap; gap:5px 9px;
    }
    .lg-item { display:flex; align-items:center; gap:4px; font-size:.62rem; color:#4a5568; }
    .lg-dot { width:7px; height:7px; border-radius:2px; flex-shrink:0; }

    /* ── Canvas area ── */
    #wrap { flex:1; position:relative; overflow:hidden; }
    canvas { display:block; }

    /* ── Idle message ── */
    #idle-msg {
      position:absolute; top:50%; left:50%;
      transform:translate(-50%,-50%);
      text-align:center; pointer-events:none;
    }
    #idle-msg .big   { font-size:1.35rem; font-weight:700; color:#2d3748; }
    #idle-msg .small { font-size:.82rem; color:#1a202c; margin-top:8px; line-height:1.6; }

    /* ── Info panel ── */
    #info-panel {
      display:none;
      position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
      width:min(calc(100% - 24px), 700px);
      background:rgba(6,10,22,0.92);
      border:1px solid rgba(99,179,237,0.22);
      border-radius:12px; padding:13px 18px;
      backdrop-filter:blur(14px);
      pointer-events:none;
    }
    #inf-route {
      font-size:.9rem; font-weight:700; color:#63b3ed;
      display:flex; align-items:center; gap:8px; margin-bottom:8px;
    }
    #inf-route .badge { font-size:.68rem; }
    #step-dots { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:8px; }
    .sdot {
      width:9px; height:9px; border-radius:50%;
      background:rgba(255,255,255,0.12); transition:all .3s;
    }
    .sdot.done   { background:#48bb78; }
    .sdot.active { background:#63b3ed; box-shadow:0 0 7px #63b3ed; transform:scale(1.35); }
    #step-desc { font-size:.81rem; color:#a0aec0; line-height:1.55; }
    #step-desc strong { color:#e2e8f0; }
    #step-desc .detail { color:#4a5568; font-size:.73rem; }
  </style>
</head>
<body>

<!-- ═══════════════  SIDEBAR  ═══════════════ -->
<div id="sidebar">
  <div id="sb-header">
    <div id="sb-title">🔗 Route Flow Visualizer</div>
    <div id="sb-sub">FindYourDate · 3D Data Flow · Click a route</div>
  </div>
  <div id="sb-scroll"><!-- buttons injected by JS --></div>
  <div id="speed-bar">
    <span id="speed-lbl">Speed:</span>
    <button class="spd" data-v="0.5">0.5×</button>
    <button class="spd on" data-v="1">1×</button>
    <button class="spd" data-v="2">2×</button>
    <button class="spd" data-v="4">4×</button>
  </div>
  <div id="legend"><!-- filled by JS --></div>
</div>

<!-- ═══════════════  3D CANVAS  ═══════════════ -->
<div id="wrap">
  <canvas id="c"></canvas>

  <div id="idle-msg">
    <div class="big">Select a Route</div>
    <div class="small">Click any button on the left to see<br>its real-time 3D data flow animation</div>
  </div>

  <div id="info-panel">
    <div id="inf-route"></div>
    <div id="step-dots"></div>
    <div id="step-desc"></div>
  </div>
</div>

<!-- ═══════════════  THREE.JS  ═══════════════ -->
<script type="importmap">
{

    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

<script type="module">

/* ══════════════════════════════════════════════════════════
   THREE.JS SCENE SETUP
══════════════════════════════════════════════════════════ */

const wrap   = document.getElementById('wrap');
const canvas = document.getElementById('c');

const scene    = new THREE.Scene();
scene.background = new THREE.Color(0x080c18);
scene.fog        = new THREE.FogExp2(0x080c18, 0.016);

const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 500);
camera.position.set(1, 5, 26);

const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance   = 5;
controls.maxDistance   = 80;
controls.target.set(0, 0, 0);

/* Lights */
scene.add(new THREE.AmbientLight(0x203060, 1.2));
const dir = new THREE.DirectionalLight(0xffffff, 0.7);
dir.position.set(10, 20, 15);
scene.add(dir);
const pt = new THREE.PointLight(0x4080ff, 0.9, 70);
pt.position.set(0, 12, 10);
scene.add(pt);

/* Stars */
{
  const g = new THREE.BufferGeometry();
  const p = new Float32Array(3600);
  for (let i = 0; i < p.length; i++) p[i] = (Math.random() - 0.5) * 220;
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color:0xffffff, size:0.13 })));
}

/* Grid */
{
  const grid = new THREE.GridHelper(34, 17, 0x111828, 0x111828);
  grid.position.y = -9;
  scene.add(grid);
}

/* ══════════════════════════════════════════════════════════
   NODE CREATION
══════════════════════════════════════════════════════════ */

const nodePos = {};   // id → THREE.Vector3
const nodeObj = {};   // id → { group, bodyMesh, bodyMat, glowMesh, glowMat }

function makeLabel(label, sub, cssColor) {
  const W = 320, H = 96;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const cx = cv.getContext('2d');
  cx.clearRect(0, 0, W, H);
  /* background */
  cx.fillStyle = 'rgba(6,10,22,0.82)';
  cx.beginPath();
  cx.rect(2, 2, W - 4, H - 4);
  cx.fill();
  /* border */
  cx.strokeStyle = cssColor;
  cx.lineWidth = 2;
  cx.beginPath();
  cx.rect(2, 2, W - 4, H - 4);
  cx.stroke();
  /* main text */
  cx.fillStyle = '#ffffff';
  cx.font = 'bold 26px Segoe UI,Arial';
  cx.textAlign = 'center';
  cx.fillText(label, W / 2, 46);
  /* sub text */
  cx.fillStyle = cssColor;
  cx.font = '18px Segoe UI,Arial';
  cx.fillText(sub, W / 2, 72);
  return new THREE.CanvasTexture(cv);
}

NODES.forEach(nd => {
  const pos = new THREE.Vector3(...nd.pos);
  nodePos[nd.id] = pos;

  const group = new THREE.Group();
  group.position.copy(pos);

  /* body cube */
  const bGeo = new THREE.BoxGeometry(2.2, 2.2, 2.2);
  const bMat = new THREE.MeshPhongMaterial({
    color: nd.hex, emissive: nd.hex, emissiveIntensity: 0.28,
    transparent: true, opacity: 0.88, shininess: 90,
  });
  const bMesh = new THREE.Mesh(bGeo, bMat);
  group.add(bMesh);

  /* wireframe edges */
  const eMat = new THREE.LineBasicMaterial({ color: nd.hex, transparent: true, opacity: 0.55 });
  group.add(new THREE.LineSegments(new THREE.EdgesGeometry(bGeo), eMat));

  /* glow sphere */
  const gGeo = new THREE.SphereGeometry(1.85, 12, 12);
  const gMat = new THREE.MeshPhongMaterial({
    color: nd.hex, emissive: nd.hex, emissiveIntensity: 0.9,
    transparent: true, opacity: 0.04,
  });
  const gMesh = new THREE.Mesh(gGeo, gMat);
  group.add(gMesh);

  /* label sprite */
  const tex = makeLabel(nd.label, nd.sub, nd.css);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
  spr.scale.set(5, 1.5, 1);
  spr.position.y = 2.9;
  group.add(spr);

  scene.add(group);
  nodeObj[nd.id] = { group, bodyMesh: bMesh, bodyMat: bMat, glowMesh: gMesh, glowMat: gMat };
});

/* ══════════════════════════════════════════════════════════
   BACKGROUND DIM CONNECTIONS
══════════════════════════════════════════════════════════ */

const BG_EDGES = [
  ['browser','express'],['express','middleware'],['express','mongousers'],
  ['express','mongochat'],['express','python'],['express','socketio'],
  ['express','files'],['files','python'],['middleware','mongousers'],
  ['socketio','mongochat'],['browser','socketio'],
];
const bgGroup = new THREE.Group();
scene.add(bgGroup);
BG_EDGES.forEach(([a, b]) => {
  const pts = [nodePos[a].clone(), nodePos[b].clone()];
  const mat = new THREE.LineBasicMaterial({ color: 0x1a2a44, transparent: true, opacity: 0.35 });
  bgGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat));
});

/* ══════════════════════════════════════════════════════════
   CURVE BUILDER
══════════════════════════════════════════════════════════ */

function buildCurve(fromId, toId) {
  const A = nodePos[fromId];
  const B = nodePos[toId];

  if (fromId === toId) {
    /* self-loop: small circle around the node */
    const pts = [];
    for (let i = 0; i <= 32; i++) {
      const a = (i / 32) * Math.PI * 2;
      pts.push(new THREE.Vector3(A.x + Math.cos(a) * 2.6, A.y + Math.sin(a) * 2.6, A.z + 0.4));
    }
    return new THREE.CatmullRomCurve3(pts, true);
  }

  /* bowed quadratic bezier */
  const mid = A.clone().lerp(B, 0.5);
  const dir = B.clone().sub(A);
  const len = dir.length();
  const perp = new THREE.Vector3(-dir.z, 0, dir.x).normalize().multiplyScalar(len * 0.13);
  perp.y += len * 0.09;
  const cp = mid.clone().add(perp);

  const pts = [];
  for (let i = 0; i <= 40; i++) {
    const t = i / 40;
    const mt = 1 - t;
    pts.push(new THREE.Vector3(
      mt * mt * A.x + 2 * mt * t * cp.x + t * t * B.x,
      mt * mt * A.y + 2 * mt * t * cp.y + t * t * B.y,
      mt * mt * A.z + 2 * mt * t * cp.z + t * t * B.z,
    ));
  }
  return new THREE.CatmullRomCurve3(pts);
}

/* ══════════════════════════════════════════════════════════
   PARTICLE POOL
══════════════════════════════════════════════════════════ */

const NUM_P    = 7;
const STAGGER  = 0.14;  /* time gap between consecutive particles */
const particles = [];

for (let i = 0; i < NUM_P; i++) {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(0.19, 8, 8),
    new THREE.MeshPhongMaterial({
      color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 1.8,
      transparent: true, opacity: 0.95,
    }),
  );
  m.visible = false;
  scene.add(m);
  particles.push(m);
}

/* ══════════════════════════════════════════════════════════
   ACTIVE ROUTE STATE
══════════════════════════════════════════════════════════ */

let activeRoute   = null;
let animClock     = 0;
let speedMult     = 1;
let lastStepShown = -1;
const STEP_DUR    = 2.3; /* seconds per step at 1× speed */

const edgeGroup = new THREE.Group();
scene.add(edgeGroup);

let stepCurves = [];
let stepTubes  = [];

/* method → particle color hex */
const METHOD_COLOR = { GET: 0x68d391, POST: 0xf6ad55, SOCKET: 0x76e4f7 };

/* ══════════════════════════════════════════════════════════
   SELECT ROUTE
══════════════════════════════════════════════════════════ */

function selectRoute(id) {
  document.querySelectorAll('.rbtn').forEach(b =>
    b.classList.toggle('active', b.dataset.id === id));

  activeRoute = ROUTES.find(r => r.id === id);
  if (!activeRoute) return;

  animClock = 0;
  lastStepShown = -1;

  /* reset all nodes */
  Object.values(nodeObj).forEach(n => {
    n.bodyMat.emissiveIntensity = 0.28;
    n.glowMat.opacity = 0.04;
  });

  /* hide particles */
  particles.forEach(p => { p.visible = false; });

  /* clear old edge tubes */
  while (edgeGroup.children.length) edgeGroup.remove(edgeGroup.children[0]);

  /* build curves + tubes for each step */
  stepCurves = [];
  stepTubes  = [];

  activeRoute.steps.forEach(step => {
    const curve = buildCurve(step.from, step.to);
    stepCurves.push(curve);

    const isSelf = step.from === step.to;
    const tubeMat = new THREE.MeshPhongMaterial({
      color: 0x63b3ed, emissive: 0x63b3ed,
      emissiveIntensity: 0.5, transparent: true, opacity: 0.12,
    });
    const tubeMesh = new THREE.Mesh(
      new THREE.TubeGeometry(curve, isSelf ? 40 : 30, 0.055, 6, isSelf),
      tubeMat,
    );
    edgeGroup.add(tubeMesh);
    stepTubes.push({ mesh: tubeMesh, mat: tubeMat });
  });

  /* info panel */
  document.getElementById('idle-msg').style.display = 'none';
  const panel = document.getElementById('info-panel');
  panel.style.display = 'block';

  const mc = activeRoute.method;
  document.getElementById('inf-route').innerHTML =
    `<span class="badge ${mc}">${mc}</span>${activeRoute.path} — ${activeRoute.label}`;

  const dotsEl = document.getElementById('step-dots');
  dotsEl.innerHTML = '';
  activeRoute.steps.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'sdot'; d.id = `sd${i}`;
    dotsEl.appendChild(d);
  });
}

/* ══════════════════════════════════════════════════════════
   ANIMATION UPDATE
══════════════════════════════════════════════════════════ */

function update(dt) {
  if (!activeRoute) return;
  animClock += dt;

  const effDur   = STEP_DUR / speedMult;
  const rawIdx   = Math.floor(animClock / effDur);
  const stepIdx  = rawIdx % activeRoute.steps.length;
  const stepFrac = (animClock / effDur) % 1;
  const step     = activeRoute.steps[stepIdx];
  const curve    = stepCurves[stepIdx];
  const pColor   = METHOD_COLOR[activeRoute.method] ?? 0x63b3ed;

  /* ── Node glow ── */
  Object.values(nodeObj).forEach(n => {
    n.bodyMat.emissiveIntensity = 0.28;
    n.glowMat.opacity = 0.04;
  });
  if (nodeObj[step.from]) {
    nodeObj[step.from].bodyMat.emissiveIntensity = 0.75 + 0.25 * Math.sin(animClock * 6);
    nodeObj[step.from].glowMat.opacity = 0.18;
  }
  if (stepFrac > 0.65 && nodeObj[step.to]) {
    nodeObj[step.to].bodyMat.emissiveIntensity = 0.65;
    nodeObj[step.to].glowMat.opacity = 0.13;
  }

  /* ── Tube brightness ── */
  stepTubes.forEach((t, i) => {
    if      (i === stepIdx) { t.mat.opacity = 0.65; t.mat.emissiveIntensity = 1.1; }
    else if (i <  stepIdx) { t.mat.opacity = 0.22; t.mat.emissiveIntensity = 0.3; }
    else                   { t.mat.opacity = 0.07; t.mat.emissiveIntensity = 0.15; }
  });

  /* ── Particles along curve ── */
  particles.forEach((p, i) => {
    const t = stepFrac - i * STAGGER;
    if (t <= 0 || t > 1) { p.visible = false; return; }
    try {
      p.position.copy(curve.getPoint(Math.min(t, 1)));
      p.visible = true;
      p.material.color.setHex(pColor);
      p.material.emissive.setHex(pColor);
      p.material.opacity = i === 0 ? 1 : Math.max(0.25, 1 - i * 0.13);
      const s = i === 0 ? 1.0 : Math.max(0.3, 1 - i * 0.11);
      p.scale.setScalar(s);
    } catch (_) { p.visible = false; }
  });

  /* ── Step info panel ── */
  if (stepIdx !== lastStepShown) {
    lastStepShown = stepIdx;
    document.getElementById('step-desc').innerHTML =
      `<strong>${step.lbl}</strong> — <span class="detail">${step.detail}</span>`;
  }
  document.querySelectorAll('.sdot').forEach((d, i) => {
    d.classList.toggle('active', i === stepIdx);
    d.classList.toggle('done',   i <  stepIdx);
  });
}

/* ══════════════════════════════════════════════════════════
   MAIN LOOP
══════════════════════════════════════════════════════════ */

const clock = new THREE.Clock();
/* Cap delta so animation doesn't jump when the tab is backgrounded or the
   system is under heavy load (e.g. first frame after the AI script runs). */
const MAX_FRAME_TIME = 0.1;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), MAX_FRAME_TIME);

  /* gentle idle rotation on all node cubes */
  Object.values(nodeObj).forEach(n => {
    n.bodyMesh.rotation.y += dt * 0.28;
    n.bodyMesh.rotation.x += dt * 0.09;
  });

  update(dt);
  controls.update();
  renderer.render(scene, camera);
}

/* ══════════════════════════════════════════════════════════
   RESIZE
══════════════════════════════════════════════════════════ */

function onResize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
onResize();
window.addEventListener('resize', onResize);

/* ══════════════════════════════════════════════════════════
   BUILD SIDEBAR BUTTONS
══════════════════════════════════════════════════════════ */

const groups = {};
ROUTES.forEach(r => { (groups[r.group] ??= []).push(r); });

const scroll = document.getElementById('sb-scroll');
Object.entries(groups).forEach(([grp, routes]) => {
  const lbl = document.createElement('div');
  lbl.className = 'grp-label';
  lbl.textContent = grp;
  scroll.appendChild(lbl);

  routes.forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'rbtn';
    btn.dataset.id = r.id;
    btn.innerHTML = `
      <div class="rbtn-top">
        <span class="badge ${r.method}">${r.method}</span>
        <span class="rbtn-path">${r.path}</span>
      </div>
      <div class="rbtn-desc">${r.desc}</div>`;
    btn.addEventListener('click', () => selectRoute(r.id));
    scroll.appendChild(btn);
  });
});

/* ══════════════════════════════════════════════════════════
   BUILD LEGEND
══════════════════════════════════════════════════════════ */

const legEl = document.getElementById('legend');
NODES.forEach(nd => {
  const item = document.createElement('div');
  item.className = 'lg-item';
  item.innerHTML = `<div class="lg-dot" style="background:${nd.css}"></div>${nd.label}`;
  legEl.appendChild(item);
});

/* ══════════════════════════════════════════════════════════
   SPEED BUTTONS
══════════════════════════════════════════════════════════ */

document.querySelectorAll('.spd').forEach(btn => {
  btn.addEventListener('click', () => {
    speedMult = parseFloat(btn.dataset.v);
    document.querySelectorAll('.spd').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
  });
});

/* start */
animate();
</script>
</body>
</html>
